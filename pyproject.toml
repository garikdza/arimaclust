[project]
name = "arimaclust"
version = "0.1.0.dev0"
description = "Consistent model-based clustering of ARIMA time series"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Garik Adamyan" }]
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "pandas",
    "scipy",
    "scikit-learn>=1.6",
    "statsmodels",
    "pmdarima",
    "joblib",
]

[dependency-groups]
dev = [
    "pytest",
    "ruff",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["arimaclust"]

[tool.ruff]
line-length = 120
extend-exclude = ["*.ipynb"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
