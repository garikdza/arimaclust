[project]
name = "arimaclust"
version = "0.1.0.dev0"
description = "Model-based time series clustering."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "garikdza" }]
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "pandas",
    "scipy",
    "scikit-learn>=1.6",
    "statsmodels",
    "pmdarima",
    "joblib",
]

[project.optional-dependencies]
examples = ["matplotlib"]

[dependency-groups]
dev = [
    "pytest",
    "pytest-cov",
    "ruff",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["arimaclust"]

[tool.ruff]
line-length = 120
src = [".", "examples", "examples/synthetic", "examples/fred_md"]
extend-exclude = ["*.ipynb"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.format]
quote-style = "single"
# README code blocks keep their hand-aligned comments
exclude = ["*.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["examples/synthetic"]
addopts = "-m 'not slow'"
markers = ["slow: statistical tests that take a while; run them with `uv run pytest -m slow`"]

[tool.coverage.run]
source = ["arimaclust"]

[tool.coverage.report]
fail_under = 85
